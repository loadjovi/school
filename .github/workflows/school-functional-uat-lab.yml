name: School Functional UAT LAB (main sync + manual, isolated)

on:
  # Keep SOP screenshots in parity whenever a Production fix lands on main.
  # PR candidates can still be deployed explicitly via workflow_dispatch.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-functional-uat-lab
  cancel-in-progress: false

jobs:
  deploy_functional_uat_lab:
    name: Deploy real functional UAT to separate SWA
    runs-on: ubuntu-latest
    environment: school-functional-uat
    steps:
      - uses: actions/checkout@v4
        # Push event uses latest main (matches Production).
        # Workflow_dispatch supports selected candidate branches; never deploys to Production.
        with:
          ref: ${{ github.ref_name }}

      - name: Safety gate - separate deployment token required
        shell: bash
        env:
          LAB_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SCHOOL_FUNCTIONAL_LAB }}
          PROD_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FIELD_09AFDDC00 }}
        run: |
          set -euo pipefail
          if [[ -z "$LAB_TOKEN" || -z "$PROD_TOKEN" ]]; then
            echo "::error::Both dedicated LAB and Production deployment secrets must exist"
            exit 1
          fi
          if [[ "$LAB_TOKEN" == "$PROD_TOKEN" ]]; then
            echo "::error::LAB token equals Production deployment token. Refusing to deploy"
            exit 1
          fi
          echo "Independent LAB token verified (values never logged)."

      - name: Record selected source commit
        shell: bash
        run: |
          echo "Source branch: $GITHUB_REF_NAME"
          echo "Source commit: $GITHUB_SHA"
          echo "LAB deployment remains isolated; NO Production data is copied."

      - name: Prepare SOP LAB from the selected code branch
        run: python3 scripts/prepare-functional-lab.py --output .functional-lab-build

      - name: Verify LAB isolation, generated API, and frontend
        run: |
          python3 -m unittest discover -s tests -p 'test_functional_lab_isolation.py' -v
          node --test tests/admin-semester-scores.test.mjs tests/admin-score-quick-filters.test.mjs tests/admin-attendance-todos.test.mjs tests/tshirt-first-receipt.test.mjs
          node --test tests/admin-private-followup.test.mjs api/test/privateLessonFollowup.test.mjs
          node --test tests/tshirt-procurement-plan.test.mjs tests/tshirt-procurement-admin.test.mjs api/test/tshirtStaffDemand.test.mjs
          node --test tests/parent-uniform-payment-notice.test.mjs
          node --test api/test/teacherParentReviews.test.mjs api/test/teacherAccountType.test.mjs
          node --test api/test/schoolScheduleRestore.test.mjs api/test/teacherLoginHistory.test.mjs api/test/sopLabDemoPreservation.test.mjs
          node --test tests/lab-data-reset.test.mjs tests/lab-private-fixtures.test.mjs
          find .functional-lab-build/api/src -name '*.js' -print0 | xargs -0 -n1 node --check
          find .functional-lab-build/api/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find .functional-lab-build/app -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check .functional-lab-build/app/sop-lab/sop.js
          node --check .functional-lab-build/app/sop-lab/data-tools.js

      - name: Upload complete frontend and Azure Functions ONLY to independent LAB
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SCHOOL_FUNCTIONAL_LAB }}
          action: upload
          app_location: .functional-lab-build/app
          api_location: .functional-lab-build/api
          output_location: "."
