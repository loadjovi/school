name: School Functional UAT LAB (main sync + manual, isolated)

on:
  # Keep SOP screenshots in parity whenever a Production fix lands on main.
  # PR candidates can still be deployed explicitly via workflow_dispatch.
  push:
    branches:
      - main
      - feat/music-learning-journey-lab-20261031
      - codex/tenant-line-production-foundation-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-functional-uat-lab
  cancel-in-progress: false

jobs:
  deploy_functional_uat_lab:
    name: Deploy real functional UAT to separate SWA
    runs-on: ubuntu-latest
    environment: school-functional-uat
    steps:
      - uses: actions/checkout@v4
        # Push event uses latest main (matches Production).
        # Workflow_dispatch supports selected candidate branches; never deploys to Production.
        with:
          ref: ${{ github.sha }}

      - name: Safety gate - separate deployment token required
        shell: bash
        env:
          LAB_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SCHOOL_FUNCTIONAL_LAB }}
          PROD_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FIELD_09AFDDC00 }}
        run: |
          set -euo pipefail
          if [[ -z "$LAB_TOKEN" || -z "$PROD_TOKEN" ]]; then
            echo "::error::Both dedicated LAB and Production deployment secrets must exist"
            exit 1
          fi
          if [[ "$LAB_TOKEN" == "$PROD_TOKEN" ]]; then
            echo "::error::LAB token equals Production deployment token. Refusing to deploy"
            exit 1
          fi
          echo "Independent LAB token verified (values never logged)."

      - name: Record selected source commit
        shell: bash
        run: |
          echo "Source branch: $GITHUB_REF_NAME"
          echo "Source commit: $GITHUB_SHA"
          echo "LAB deployment remains isolated; NO Production data is copied."

      - name: Prepare SOP LAB from the selected code branch
        run: |
          build_args=(--output .functional-lab-build)
          if [[ "$GITHUB_REF_NAME" == "codex/tenant-line-production-foundation-20261115" ]]; then
            build_args+=(--line-uat)
          fi
          python3 scripts/prepare-functional-lab.py "${build_args[@]}"

      - name: Verify LAB isolation, generated API, and frontend
        run: |
          python3 -m unittest discover -s tests -p 'test_functional_lab_isolation.py' -v
          node --test tests/admin-semester-scores.test.mjs tests/admin-score-quick-filters.test.mjs tests/admin-attendance-todos.test.mjs tests/tshirt-first-receipt.test.mjs
          node --test tests/admin-private-followup.test.mjs api/test/privateLessonFollowup.test.mjs
          node --test tests/music-learning-journey.test.mjs
          node --test tests/parent-login-module-bootstrap.test.mjs tests/role-home-priorities.test.mjs tests/parent-home-activity-tasks.test.mjs
          node --test tests/parent-login-request-efficiency.test.mjs tests/parent-login-profile-reuse.test.mjs tests/parent-calendar-activity-link.test.mjs
          node --test tests/parent-tshirt-size-reminder.test.mjs tests/parent-leaderboard-finalized-default.test.mjs
          node --test tests/paid-activity-line.test.mjs tests/paid-activity-delivery.test.mjs tests/activity-settings-ui.test.mjs tests/activity-date-fields.test.mjs tests/activity-notification-return.test.mjs
          node --test tests/line-notification-center.test.mjs tests/line-notification-selector.test.mjs
          node --test tests/tshirt-procurement-plan.test.mjs tests/tshirt-cadre-application.test.mjs tests/tshirt-procurement-admin.test.mjs tests/tshirt-stock-count.test.mjs tests/tshirt-opened-stock.test.mjs tests/tshirt-master-orders.test.mjs api/test/tshirtStaffDemand.test.mjs api/test/tshirtPurchaseOrderRules.test.mjs
          node --test tests/volunteer-loan-size-correction.test.mjs tests/volunteer-loan-return-stock.test.mjs
          node --test tests/tshirt-receiving-workflow.test.mjs tests/uniform-request-approval.test.mjs api/test/uniformRequestApproval.test.mjs tests/uniform-payment-line.test.mjs
          node --test tests/school-absence-followup.test.mjs
          node --test tests/parent-uniform-payment-notice.test.mjs tests/payment-email-notifications.test.mjs tests/finance-payment-notifications.test.mjs
          node --test api/test/teacherParentReviews.test.mjs api/test/teacherAccountType.test.mjs
          node --test tests/private-lesson-line-review.test.mjs tests/private-lesson-line-confirm-ui.test.mjs tests/private-lesson-parent-line.test.mjs tests/parent-private-review-refresh-guard.test.mjs tests/private-lesson-no-auto-redraw.test.mjs api/test/privateLessonCompletionResilience.test.mjs
          node --test api/test/schoolScheduleRestore.test.mjs api/test/teacherLoginHistory.test.mjs api/test/sopLabDemoPreservation.test.mjs
          node --test tests/lab-data-reset.test.mjs tests/lab-private-fixtures.test.mjs
          node --test tests/payment-resolution.test.mjs tests/lab-line-first-notifications.test.mjs tests/tenant-line-isolation.test.mjs tests/tenant-line-workflows.test.mjs tests/tenant-notification-isolation.test.mjs tests/fee-collection-rules.test.mjs tests/line-activity-calendar.test.mjs tests/line-latest-announcements.test.mjs tests/line-today-courses.test.mjs
          find .functional-lab-build/api/src -name '*.js' -print0 | xargs -0 -n1 node --check
          find .functional-lab-build/api/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find .functional-lab-build/app -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check .functional-lab-build/app/sop-lab/sop.js
          node --check .functional-lab-build/app/sop-lab/data-tools.js

      - name: Upload complete frontend and Azure Functions ONLY to independent LAB
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SCHOOL_FUNCTIONAL_LAB }}
          action: upload
          deployment_environment: ${{ github.ref_name == 'codex/tenant-line-production-foundation-20261115' && 'lineuat' || '' }}
          app_location: .functional-lab-build/app
          api_location: .functional-lab-build/api
          output_location: "."
