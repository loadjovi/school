name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  # Keep production pushes separate from PR preview/close jobs.
  group: azure-static-web-apps-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: JavaScript syntax check
        run: |
          find api/src -name "*.js" -print0 | xargs -0 -n1 node --check
          find app -maxdepth 1 -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Attendance to-do regression tests
        run: node --test tests/admin-attendance-todos.test.mjs
      - name: Semester score private lesson follow-up regression tests
        run: node --test tests/admin-semester-scores.test.mjs tests/admin-score-quick-filters.test.mjs tests/admin-private-followup.test.mjs api/test/privateLessonFollowup.test.mjs
      - name: Teacher parent review identity regression tests
        run: node --test api/test/teacherParentReviews.test.mjs api/test/teacherAccountType.test.mjs
      - name: Course restoration and teacher login history regression tests
        run: node --test api/test/schoolScheduleRestore.test.mjs api/test/teacherLoginHistory.test.mjs
      - name: Competition uniform canonical master regression tests
        run: node --test tests/competition-uniform-master.test.mjs
      - name: T-shirt semester procurement and staff demand regression tests
        run: node --test tests/tshirt-procurement-plan.test.mjs tests/tshirt-procurement-admin.test.mjs api/test/tshirtStaffDemand.test.mjs
      - name: First-time T-shirt receipt regression tests
        run: node --test tests/tshirt-first-receipt.test.mjs

      - name: Parent home uniform payment notice tests
        run: node --test tests/parent-uniform-payment-notice.test.mjs tests/payment-email-notifications.test.mjs
      - name: Administrative attendance section completion regression tests
        run: node --test tests/admin-assist-section-status.test.mjs
      - name: School administrative attendance workspace regression tests
        run: node --test tests/admin-attendance-workspace.test.mjs
      - name: First-issue T-shirt parent progress regression tests
        run: node --test tests/tshirt-progress-first-issue.test.mjs
      - name: Functional UAT isolation and parity tests
        run: python3 -m unittest discover -s tests -p 'test_functional_lab_isolation.py' -v

      - name: LAB reset recovery and private lesson fixture tests
        run: node --test tests/lab-data-reset.test.mjs tests/lab-private-fixtures.test.mjs api/test/sopLabDemoPreservation.test.mjs
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FIELD_09AFDDC00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app"
          api_location: "api"
          output_location: "."

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FIELD_09AFDDC00 }}
          action: "close"
