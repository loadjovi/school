<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團服匯款回報｜測試版</title><style>body{font:16px system-ui,sans-serif;max-width:650px;margin:24px auto;padding:16px;background:#f5f8f6;color:#183d31}section{background:white;padding:20px;border-radius:12px;margin:15px 0}label{display:block;margin:12px 0}input,select,button{padding:10px;font:inherit}button{background:#21684b;color:white;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.warn{color:#945c12}</style></head><body><a href="/">← 返回平台</a><h1>🎻 團服匯款回報</h1><p class="warn">PR #22 測試功能。僅已核准且確認應繳金額的訂單可以查看匯款帳戶；回報後仍待財務核帳。</p><section><label>申請單 ID<input id="order" placeholder="請貼上本人團服申請單 ID"></label><label>項目<select id="kind"><option value="regularUniform">團 T</option><option value="competitionUniform">A 團比賽服</option></select></label><button id="lookup">查詢本人應繳資訊</button><p id="status"></p><div id="details" hidden><p id="account"></p><p id="amount"></p><label>匯款日期<input id="date" type="date"></label><label>匯款帳號後五碼<input id="lastFive" maxlength="5" inputmode="numeric" pattern="[0-9]{5}"></label><button id="submit">送出匯款回報</button></div></section><script type="module" src="/uniform-transfer.js"></script></body></html>
