<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團T歷史尺寸補登</title><style>body{font:16px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:16px;background:#f5f8f6;color:#173d30}section{background:#fff;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:12px 0}input,select,button{padding:10px;font:inherit}button{background:#21674c;color:white;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.note{color:#76581a}article{border-top:1px solid #ddd;padding:12px 0}</style></head><body><a href="/">← 返回平台</a><h1>🎻 團T歷史尺寸補登</h1><p class="note">僅供去年已配發團T的學生補登尺寸，不會新增訂單、收費或變更首次免費資格。必須先由管理員核對學生歷史配發紀錄。</p><p id="status">讀取資料中…</p><section><h2>已確認配發的學生</h2><div id="items"></div></section><section id="admin" hidden><h2>管理員：核對歷史配發</h2><p class="note">請先從正式學生主檔確認 studentId 與已配發事實。李沛臻及儲備團尚未配發，不得建立此紀錄。請勿以全校批次推定。</p><form id="verify"><label>學生 ID<input name="studentId" required pattern="[A-Za-z0-9_-]{1,100}"></label><label>歷史已配發件數<input name="quantity" type="number" min="1" max="20" value="1" required></label><label><input type="checkbox" name="confirmedIssued" required> 已核對確實配發，確認建立歷史紀錄</label><button>確認歷史配發</button></form></section><script type="module" src="/tshirt-historical-size.js"></script></body></html>
