<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團服與活動管理</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:25px auto;padding:15px;background:#f6f8f7;color:#183b2c}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,select{padding:8px;max-width:400px;width:100%;display:block}button{background:#24694d;color:white;border:0;padding:10px;border-radius:6px;cursor:pointer}pre{overflow:auto;background:#eef3f0;padding:12px}a{color:#24694d}</style></head><body><a href="/">← 返回平台</a><h1>🎻 團服與活動管理（PR 預覽）</h1><p>僅管理員可使用。團服歷史領用資料尚未匯入，請勿以此介面確認免費資格或實際發放。</p><p id="status">驗證身分中…</p><section><h2>模組／活動設定</h2><form id="config"><label>模組<select name="module"><option value="regularUniform">一般團服</option><option value="competitionUniform">A 團比賽服</option><option value="fieldTrip">校外教學</option><option value="yearEndDinner">期末聚餐</option></select></label><label>設定 ID（團服填 default）<input name="id" value="default" required></label><label>啟用<select name="enabled"><option value="false">關閉</option><option value="true">開啟</option></select></label><label>報名開始<input name="openAt" type="datetime-local"></label><label>報名結束<input name="closeAt" type="datetime-local"></label><label>活動名稱<input name="title"></label><label>活動地點<input name="location"></label><label>活動日期<input name="startAt" type="datetime-local"></label><label>學生費用<input name="studentFee" type="number" min="0" value="0"></label><label>首位大人費用<input name="firstAdultFee" type="number" min="0" value="0"></label><label>額外大人費用<input name="extraAdultFee" type="number" min="0" value="0"></label><label>額外兒童費用<input name="extraChildFee" type="number" min="0" value="0"></label><button>儲存設定</button></form><pre id="settings">尚未載入</pre></section><section><h2>申請資料（唯讀）</h2><pre id="requests">尚未載入</pre></section><section><h2>庫存（唯讀）</h2><pre id="stock">尚未載入</pre></section><button id="reload">重新整理</button><script type="module" src="/uniform-event-admin.js"></script></body></html>
