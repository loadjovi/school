<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團服與活動管理</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:25px auto;padding:15px;background:#f6f8f7;color:#183b2c}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,select{padding:8px;max-width:400px;width:100%;display:block}button{background:#24694d;color:white;border:0;padding:10px;border-radius:6px;cursor:pointer}pre{overflow:auto;background:#eef3f0;padding:12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}#requests,#stock{overflow:auto}.warn{color:#ad5e05}button{margin:4px}a{color:#24694d}</style></head><body><a href="/">← 返回平台</a><h1>🎻 團服與活動管理（PR 預覽）</h1><p>僅管理員可使用。團服歷史領用資料尚未匯入，請勿以此介面確認免費資格或實際發放。</p><p id="status">驗證身分中…</p><section><h2>模組／活動設定</h2><form id="config"><label>模組<select name="module"><option value="regularUniform">一般團服</option><option value="competitionUniform">A 團比賽服</option><option value="fieldTrip">校外教學</option><option value="yearEndDinner">期末聚餐</option></select></label><label>設定 ID（團服填 default）<input name="id" value="default" required></label><label>啟用<select name="enabled"><option value="false">關閉</option><option value="true">開啟</option></select></label><label>報名開始<input name="openAt" type="datetime-local"></label><label>報名結束<input name="closeAt" type="datetime-local"></label><label>活動名稱<input name="title"></label><label>活動地點<input name="location"></label><label>活動日期<input name="startAt" type="datetime-local"></label><label>學生費用<input name="studentFee" type="number" min="0" value="0"></label><label>首位大人費用<input name="firstAdultFee" type="number" min="0" value="0"></label><label>額外大人費用<input name="extraAdultFee" type="number" min="0" value="0"></label><label>額外兒童費用<input name="extraChildFee" type="number" min="0" value="0"></label><button>儲存設定</button></form><pre id="settings">尚未載入</pre></section><section><h2>申請資料（管理）</h2><p id="requestsStatus">等待查詢</p><div id="requestSummary"></div><div id="requests">尚未載入</div><button type="button" id="exportRequests">匯出申請 CSV</button><label>匯入申請 CSV（僅預覽檢查，不寫入資料庫）<input type="file" id="importRequests" accept=".csv,text/csv"></label><div id="previewRequests"></div></section><section><h2>庫存（管理）</h2><p id="stockStatus">等待查詢</p><div id="stock">尚未載入</div><button type="button" id="exportStock">匯出庫存 CSV</button><label>匯入庫存 CSV（僅預覽檢查，不寫入資料庫）<input type="file" id="importStock" accept=".csv,text/csv"></label><div id="previewStock"></div><h3>庫存盤點與調整</h3><form id="inventoryForm"><label>團服種類<select name="type" id="inventoryType"><option value="regularUniform">一般團服</option><option value="competitionUniform">A 團比賽服</option></select></label><label>款式<select name="style" id="inventoryStyle"><option value="">一般團服</option><option value="男">男款</option><option value="女">女款</option></select></label><label>尺寸<select name="size" id="inventorySize"><option>8</option><option>10</option><option>12</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2L</option><option>3L</option><option>5L</option></select></label><label>動作<select name="action"><option value="SET_COUNT">盤點設定現有數量</option><option value="ADJUST">增加／減少庫存</option><option value="RESERVE">保留庫存</option><option value="RELEASE">解除保留</option></select></label><label>數量<input name="amount" type="number" step="1" required></label><button>確認庫存異動</button></form></section><button id="reload">重新整理</button><script type="module" src="/uniform-event-admin.js?v=20261011-size-csv-status"></script></body></html>
