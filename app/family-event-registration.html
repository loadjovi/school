<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校外教學與期末聚餐報名</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:16px;background:#f6f8f7;color:#193c2d}section{background:white;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:12px 0}select,input{display:block;padding:10px;margin-top:5px;max-width:100%;box-sizing:border-box}button{background:#256b50;color:white;padding:12px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}.hint{color:#75511b}</style></head><body><a href="/">← 返回平台</a><h1>🎻 校外教學／學期末聚餐</h1><p class="hint">PR #22 測試頁。家長報名成功後才納入統計；報名不代表已繳費。請勿在未確認測試資料庫隔離前提交真實報名。</p><p id="status">讀取帳號及活動中…</p><section><h2>家庭報名</h2><form id="registration"><label>選擇活動<select id="event" required></select></label><div id="students"></div><label>陪同大人（至少 1 位）<select id="adults"></select></label><label>非弦樂團同行兒童<select id="children"></select></label><p id="summary"></p><button id="submit" disabled>確認報名</button></form></section><section><h2>我的報名與繳費狀態</h2><div id="registrations">尚未載入</div><p class="hint">只有後台確認費用、開放付款後，才會提供繳費回報。匯款回報不代表財務已核實。</p></section><script type="module" src="/family-event-registration.js"></script></body></html>
