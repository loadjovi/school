<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f4e3d">
  <title>聖心弦樂團｜Google Gmail 登入版 v2</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Azure Static Web Apps may process the standard Authorization header.
    // Mirror Google ID tokens into a dedicated application header before requests are sent.
    (() => {
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const headers = new Headers(init.headers || {});
        const auth = headers.get('Authorization');
        if (auth && auth.toLowerCase().startsWith('bearer ')) {
          headers.set('X-Google-ID-Token', auth.slice(7).trim());
          headers.delete('Authorization');
        }
        return nativeFetch(input, { ...init, headers });
      };
    })();
  </script>
</head>
<body>
  <div id="app"><div class="loading">🎻 系統載入中…</div></div>
  <div id="toast" class="toast"></div>
  <script src="/app-v2.js" defer></script>
</body>
</html>
